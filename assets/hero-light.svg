  <text x="836" y="216" fill="#9a6700" font-size="12.5" letter-spacing="0.6" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">metropolisfplab 2026 · winner</text>
