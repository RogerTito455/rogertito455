<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" role="img" aria-label="Roger Tito Farez — junior developer, Barcelona. DAW 2025–2027. Internal tools and workflow automations. Available for internships from summer 2026.">
  <defs>
